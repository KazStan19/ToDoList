<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/Style/css/app.css">
    <title>ToDoList JavaScript</title>
    
</head>
<body>
    
    <header>
        <div>
            <button id="themeToggleBtn" class="theme-toggle-button">🌙</button>
        </div>
    </header>

    <main>
        <div id="calendarContainer" class="calendar-grid">
            <div class="calendar-header">
                <h2>2026-05-28</h2>
                <h3>10:50 PM</h3>
            </div>
            <table>
                <thead>
                    <tr>

                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                        <th>Sunday</th>

                    </tr>
                </thead>
                <tbody>
                    <tr id="column1"></tr>
                    <tr id="column2"></tr>
                    <tr id="column3"></tr>
                    <tr id="column4"></tr>
                    <tr id="column5"></tr>
                </tbody>
            </table>

        </div>
    </main>

    <script type="module" src="./src/index.js"></script>
</body>
</html
